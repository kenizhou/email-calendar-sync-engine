[package]
name = "engine-host"
description = "Host-side read models over an engine-api Engine's SQLite store: the conversation (thread) summary list first, with the P1 event, round, warm and attachment reads accumulating here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
engine-api = { workspace = true }
engine-core = { workspace = true }
engine-store = { workspace = true }
store-sqlite = { workspace = true }
async-trait = { workspace = true }
# The warm's batch source type names `ProviderError` directly (per-item failures
# travel inline in the batch result, not as a whole-call error), and the sequential
# default is generic over the `Provider` trait — neither is re-exported by engine-api.
engine-provider = { workspace = true }
# The warm extracts the displayable body text from each fetched raw source with the
# same shared MIME parser `engine-sync`'s single-message path uses, so the batch and
# single-message halves of the cache agree on what a body is.
engine-mime = { workspace = true }
# The two batch-source impls (EAS: sequential default; IMAP: the UID-set pipeline)
# are local-trait-for-foreign-type impls that live here rather than in the adapters,
# so the adapters stay free of host concepts.
provider-eas = { workspace = true }
provider-imap = { workspace = true }
# Only the stream trait bounds on the `ImapProvider` batch impl (`AsyncRead +
# AsyncWrite`); no extra features — the host crate itself spawns nothing.
tokio = { workspace = true }
# The read seam hands host code a `rusqlite::Connection` inside
# `host_store().read(|conn| …)`: naming its parameter and row types is why the host
# names the backend directly rather than reaching it only through `store-sqlite`.
rusqlite = { workspace = true }
# The event contract (`events`) is plain data by design: derive-only serde, so the
# host shell and its TypeScript mirror read one stable JSON shape off every event.
serde = { workspace = true }
# The attachment vault content-addresses its files by sha256 — the same digest
# discipline the engine's own blob area uses (`store-sqlite`), applied host-side.
sha2 = { workspace = true }

[dev-dependencies]
# The IMAP batch test connects the real `ImapProvider` to an in-process TLS server:
# `io-util`/`net` for the line protocol over TCP, on top of the workspace's macros/rt.
tokio = { workspace = true, features = ["io-util", "net"] }
# The fake's `stream_email` yields a single-chunk stream via
# `futures_util::stream::iter`, exactly as engine-api's own facade tests do.
futures-util = { workspace = true }
# The in-process IMAP server the batch test speaks TLS to: the host-injected trust
# policy pins exactly the server's self-signed cert (the `tls_info` harness shape).
engine-tls = { workspace = true }
tokio-rustls = { workspace = true }
# Generates that self-signed cert — the same dev-dependency provider-imap's own
# offline TLS tests use.
rcgen = "0.13"
# The event tests pin the contract's wire shape to the byte, so they serialize
# through serde_json itself rather than trusting the derive round-trip.
serde_json = { workspace = true }
# The round tests reconstruct a crash-orphaned outbox op (enqueued, never
# claimed) by serializing an `OutboxIntent` exactly as the inline submit driver
# does; the facade re-exports its signature types but not the intent envelope.
engine-sync = { workspace = true }
# The attachment tests give each vault its own throwaway root directory.
tempfile = { workspace = true }

[lints]
workspace = true
