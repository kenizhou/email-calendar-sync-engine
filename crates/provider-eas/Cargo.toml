[package]
name = "provider-eas"
description = "Exchange ActiveSync (EAS) protocol client: WBXML codec, command builders/parsers, transport with retry/redirect, Provision, Ping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The streaming email pass (`adapter/email.rs`) yields its chunks through
# `async_stream::try_stream!` — the IMAP/JMAP stream-verb precedent.
async-stream = { workspace = true }
# The adapter skeleton implements `engine_provider::Provider` (connection
# facts + the EAS scope overrides), over the engine's ids and sync scopes.
engine-core = { workspace = true }
# `http` enables `ObservedHttpVersion` / `HttpVersion::from_http` — the one
# place a reqwest response's version maps onto the neutral
# `ConnectionInfo::http_version`, the same feature the JMAP/CalDAV/Graph
# transports hold it for.
engine-provider = { workspace = true, features = ["http"] }
# The submit verb assembles the `Draft` into RFC 5322 bytes — the Graph
# adapter's assembler seam (`assemble_filed_message`, `parse_message_id`).
engine-rfc5322 = { workspace = true }
# The assembler takes the send's `OffsetDateTime` for the Date header.
time = { workspace = true }
# One TLS trust policy for every provider (`docs/agent-guidance/tls.md`): the
# transport builds its `reqwest::Client` from the host-supplied `TlsClientConfig`,
# exactly like Graph/JMAP. `reqwest` enables the preconfigured-client builder
# (`tls_backend_preconfigured`); the workspace reqwest is 0.13/rustls-configured.
engine-tls = { workspace = true, features = ["reqwest"] }
reqwest = { workspace = true }
# Beyond the workspace's `macros`/`rt`/`rt-multi-thread`, the transport needs the
# socket/time feature set the imported code was written against.
tokio = { workspace = true, features = ["net", "io-util", "sync", "time"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hickory-resolver = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The gated live tests' self-signed-server gate (`EAS_LIVE_INSECURE`) needs
# the test-only accept-any config — the production `accept_invalid_certs` escape is
# gone (trust is the host's `TlsPolicy`, see `docs/agent-guidance/eas.md`).
engine-tls = { workspace = true, features = ["dangerous-testing"] }
tokio-test = { workspace = true }
env_logger = { workspace = true }
hex = { workspace = true }
# The offline transport harness (tests/transport_harness.rs) stands up an
# in-process TLS listener for the HTTP 451 `X-MS-Location` redirect and the
# autodiscover scenarios (both need genuine https:// — the client refuses
# http:// redirect locations and builds autodiscover URLs as https:// by
# spec). `rcgen` mints the self-signed cert and `rustls` serves it — the
# engine-tls dev-deps precedent; both are pure Rust and already in the
# workspace lock via engine-tls's own dev-deps.
rcgen = "0.13"
rustls = { workspace = true }
# The adapter flow tests drive `stream_email`'s `EmailStream` (a boxed
# `Stream`) with `StreamExt::next` — the provider-imap stream-tests precedent.
futures-util = { workspace = true }

[lints]
workspace = true
