[package]
name = "engine-api"
description = "Stable host facade for provider-neutral mail, calendar, contact, people, recipient, search, sync, and durable write APIs over SQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
engine-core = { workspace = true }
# Re-exported so a host configures throttling through the facade, like the rest of its
# provider wiring (docs/agent-guidance/http-throttling.md).
engine-http = { workspace = true }
# The single hardened iCalendar parser, for `Engine::message_scheduling`. iMIP arrives over
# *mail* on every account type, so this read must not depend on the CalDAV adapter being in
# the build — which is exactly why the parser is its own transport-neutral crate.
engine-ical = { workspace = true }
engine-store = { workspace = true }
engine-sync = { workspace = true }
engine-provider = { workspace = true }
engine-recurrence = { workspace = true }
engine-search = { workspace = true }
store-sqlite = { workspace = true }
serde = { workspace = true }
# Deserializes the store's normalized object payloads (Value) into the domain types
# the read methods return (Mailbox/Message).
serde_json = { workspace = true }
thiserror = { workspace = true }
# `OffsetDateTime::now_utc` needs time's `std` feature; require it explicitly so the
# crate keeps compiling even if the workspace dep ever turns default features off.
time = { workspace = true, features = ["std"] }
# Mints the per-intent idempotency key of `Engine::rsvp_invitation` — the one
# calendar write whose facade signature carries no caller key (the invitation
# message names the target, the answer names the intent, and neither is unique
# across a change of mind).
uuid = { workspace = true }

[dev-dependencies]
# `sync` adds tokio::sync::oneshot, used to deterministically interleave two syncs
# in the concurrent-scope (ApiError::Busy) test.
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true }
tempfile = { workspace = true }
# The streaming `Provider::stream_email` test fakes yield a single-chunk stream via
# `futures_util::stream::iter`.
futures-util = { workspace = true }

[lints]
workspace = true
